name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Architecture & Quality Gates ────────────────────────────────────
  check:
    name: Architecture & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Install UI dependencies (typescript + lint + ui typecheck)
        run: npm install --prefix apps/windows-client/ui

      # Full local static gate (arch + filesize + secrets + all TS type-checks +
      # lint + ui-types + ts-coverage + js-boundary + icons). Keeps CI at parity
      # with the local `npm run check` so the local gate is not the only safety net.
      - name: Static quality gate (npm run check)
        run: npm run check

  # ── Job 2: Host Unit Tests ─────────────────────────────────────────────────
  test-host:
    name: Host Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run host unit tests
        # Windows-only plan tests in runtime-dependency-plans.test.ts self-skip on
        # non-Windows via a platform guard (winOnly), so no file exclusion is needed.
        # Tests run through the host TS loader (scripts/run-host-node.mjs) with
        # scripts/test-setup.ts. No --test-isolation flag: it needs Node 22.8+ and
        # CI pins Node 22; the suite is isolation-safe (single-process run locally).
        run: |
          FILES=$(cd apps/host && ls test/*.test.ts | tr '\n' ' ')
          node scripts/run-host-node.mjs --cwd apps/host -- --test --test-timeout=60000 --import ../../scripts/test-setup.ts $FILES
        env:
          KCW_REQUIRE_AUTH: "false"
          KCW_TRUST_IDENTITY_HEADERS: "true"
          KCW_AUTH_PERSIST: "false"
          KCW_KIMI_API_KEY: ""
          KCW_SANDBOX_DOCKER_IMAGE: ""

  # ── Job 3: UI Unit Tests ───────────────────────────────────────────────────
  test-ui:
    name: UI Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install UI dependencies
        run: npm install --prefix apps/windows-client/ui

      - name: Run UI unit tests (vitest)
        run: npm --prefix apps/windows-client/ui run test -- --run
