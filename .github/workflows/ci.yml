name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Architecture & Quality Gates ────────────────────────────────────
  check:
    name: Architecture & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm install

      - name: Install UI dependencies (provides TypeScript for host type-check)
        run: npm install --prefix apps/windows-client/ui

      - name: L0-L4 Architecture compliance
        run: npm run check:arch

      - name: File size gate
        run: npm run check:filesize

      - name: Secrets scan
        run: npm run check:secrets

      - name: Host TypeScript type check
        run: npm run check:host-types

      - name: Icon assets check
        run: npm run check:icons

  # ── Job 2: Host Unit Tests ─────────────────────────────────────────────────
  test-host:
    name: Host Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run host unit tests
        # Excludes runtime-dependencies.test.ts: those tests call
        # normalizeAgentCoworkRoot() which requires a Windows path ending in
        # "AgentCowork" — they are intentionally Windows-only (CI runs on Linux).
        # Tests migrated JS→TS: run them through the host TS loader
        # (scripts/run-host-node.mjs) with scripts/test-setup.ts. No
        # --test-isolation flag: it needs Node 22.8+ and CI pins Node 22; the
        # suite is isolation-safe (single-process run passes 758/skip 1 locally).
        run: |
          FILES=$(cd apps/host && ls test/*.test.ts | grep -v runtime-dependencies.test.ts | tr '\n' ' ')
          node scripts/run-host-node.mjs --cwd apps/host -- --test --test-timeout=60000 --import ../../scripts/test-setup.ts $FILES
        env:
          KCW_REQUIRE_AUTH: "false"
          KCW_TRUST_IDENTITY_HEADERS: "true"
          KCW_AUTH_PERSIST: "false"
          KCW_KIMI_API_KEY: ""
          KCW_SANDBOX_DOCKER_IMAGE: ""
