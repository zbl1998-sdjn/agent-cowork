name: PostgreSQL Integration

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/postgres-integration.yml"
      - "apps/host/src/storage/migrations-postgres/**"
      - "apps/host/src/storage/postgres-approval*.ts"
      - "apps/host/src/storage/postgres-migration*.ts"
      - "scripts/postgres-integration/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.postgres-integration.json"
      - "types/host-node-shim.d.ts"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/postgres-integration.yml"
      - "apps/host/src/storage/migrations-postgres/**"
      - "apps/host/src/storage/postgres-approval*.ts"
      - "apps/host/src/storage/postgres-migration*.ts"
      - "scripts/postgres-integration/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.postgres-integration.json"
      - "types/host-node-shim.d.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-integration:
    name: Disposable PostgreSQL approval acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine3.22@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_DB: kcw_test
          POSTGRES_USER: kcw_test_user
          POSTGRES_PASSWORD: test-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kcw_test_user -d kcw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and lint the isolated integration suite
        run: |
          npx tsc -p tsconfig.postgres-integration.json --pretty false
          npx eslint "scripts/postgres-integration/**/*.ts"

      - name: Run migrations and real LISTEN/NOTIFY acceptance
        env:
          DATABASE_URL: ""
          KCW_TEST_POSTGRES_URL: postgres://kcw_test_user:test-only-postgres-password@127.0.0.1:5432/kcw_test
        run: >-
          node scripts/run-host-node.mjs -- --test
          --test-concurrency=1
          --test-timeout=120000
          scripts/postgres-integration/postgres-test-url.test.ts
          scripts/postgres-integration/postgres-migrations.integration.test.ts
          scripts/postgres-integration/postgres-approvals.integration.test.ts
