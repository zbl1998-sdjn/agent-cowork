[package]
name = "agent-cowork-desktop"
version = "0.4.0"
description = "Tauri shell for Agent Cowork"
edition = "2021"
rust-version = "1.77"

[features]
# 生产前端内嵌开关。`tauri build` 会自动启用;若手动用 `cargo build --release` 产生产版,
# 必须显式带上 `--features custom-protocol`,否则 exe 会回退去连 devUrl(本机 dev server),
# 把 dev 端口上的外部前端加载进有 IPC 权限的窗口(见 lib.rs 的生产护栏 dev_mode_forbidden)。
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "agent_cowork_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
